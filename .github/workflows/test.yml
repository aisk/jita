name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install cross binutils for the other architectures' oracles
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "$(uname -m)" = x86_64 ]; then
            sudo apt-get install -y binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu
          else
            sudo apt-get install -y binutils-x86-64-linux-gnu binutils-riscv64-linux-gnu
          fi
      - run: uv sync
      - run: uv run pytest -q -ra

  riscv64:
    # The suite under qemu-user with a riscv64 CPython, so the riscv64
    # execution tests really execute. test_typing needs the host checkers.
    runs-on: ubuntu-latest
    env:
      PYTHON_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.14.7+20260924-riscv64-unknown-linux-gnu-install_only.tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install qemu-user, riscv64 binutils and the riscv64 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-riscv64-linux-gnu libc6-riscv64-cross libgcc-s1-riscv64-cross libatomic1-riscv64-cross
      - name: Download a riscv64 CPython and pytest
        run: |
          curl -fsSL "$PYTHON_URL" | tar -xz -C "$RUNNER_TEMP"
          # pytest and its dependencies are pure Python, so wheels resolved
          # on the host run on the riscv64 interpreter.
          uv pip install --python 3.14 --target "$RUNNER_TEMP/site" pytest
      - name: Run the tests under qemu-riscv64
        shell: bash  # -eo pipefail
        env:
          JITA_REQUIRE_RISCV64: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export PYTHONPATH="$RUNNER_TEMP/site"
          run() { qemu-riscv64 -L /usr/riscv64-linux-gnu "$RUNNER_TEMP/python/bin/python3.14" "$@"; }
          run -c 'import platform; assert platform.machine() == "riscv64", platform.machine()'
          run -m pytest tests -p no:cacheprovider --ignore tests/test_typing.py -ra | tee pytest.log
          if grep -E "SKIPPED .*(test_riscv64_(exec|encode)|needs a riscv64 host)" pytest.log; then
            echo "riscv64 tests were skipped"
            exit 1
          fi
          PYTHONPATH=. run examples/riscv64_hello.py | tee example.log
          grep -q "sum(1..100) = 5050" example.log

  loongarch64:
    # The suite under qemu-user with Debian's loong64 CPython, so the
    # loongarch64 execution tests really execute. Ubuntu has no loongarch
    # cross packages, so the job runs in a Debian sid container, where
    # everything is root and there is no sudo.
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install qemu-user and loongarch64 binutils
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git qemu-user binutils-loongarch64-linux-gnu
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Unpack a loong64 CPython with its glibc and install pytest
        run: |
          # glibc and the GCC runtime come from the same index as Python, so
          # they match however far the cross packages lag behind sid.
          uv run --no-project --python 3.14 tools/fetch_debian_python.py --with-libc loong64 3.14 "$RUNNER_TEMP/loong64" >> "$GITHUB_ENV"
          # pytest and its dependencies are pure Python, so wheels resolved
          # on the host run on the loong64 interpreter.
          uv pip install --python 3.14 --target "$RUNNER_TEMP/site" pytest
      - name: Run the tests under qemu-loongarch64
        shell: bash  # -eo pipefail
        env:
          JITA_REQUIRE_LOONGARCH64: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export PYTHONPATH="$RUNNER_TEMP/site"
          run() { qemu-loongarch64 -L "$PYTHON_SYSROOT" "$PYTHON" "$@"; }
          run -c 'import platform; assert platform.machine() == "loongarch64", platform.machine()'
          run -m pytest tests -p no:cacheprovider --ignore tests/test_typing.py -ra | tee pytest.log
          if grep -E "SKIPPED .*(test_loongarch64_(exec|encode)|needs a loongarch64 host)" pytest.log; then
            echo "loongarch64 tests were skipped"
            exit 1
          fi
          PYTHONPATH=. run examples/loongarch64_hello.py | tee example.log
          grep -q "sum(1..100) = 5050" example.log
