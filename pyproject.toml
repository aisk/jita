[project]
name = "jita"
version = "0.1.0"
description = "Runtime x64 and aarch64 code generation at the abstraction level of DynASM"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jita"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["jita", "examples", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# mypy reads `# type: ignore`, pyright reads `# pyright: ignore`, so each
# checker reports its own unused suppressions.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
python_version = "3.14"
files = ["jita", "examples", "tests"]
warn_unused_ignores = true
check_untyped_defs = true
